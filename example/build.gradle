plugins { id 'java' }

repositories {
    if (providers.gradleProperty('candidateRepository').isPresent()) {
        exclusiveContent {
            forRepository {
                maven {
                    url = uri(providers.gradleProperty('candidateRepository').get())
                }
            }
            filter { includeModule('io.github.lambig', 'Tuplite') }
        }
    }
    mavenCentral()
}
dependencies {
    implementation "io.github.lambig:Tuplite:${providers.gradleProperty('libraryVersion').getOrElse('1.0.1')}"
}
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}
tasks.register('runExample', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'example.TupleExample'
    if (providers.environmentVariable('TEST_JAVA_HOME').isPresent()) {
        executable = providers.environmentVariable('TEST_JAVA_HOME').get() + '/bin/java'
    }
    doFirst {
        def jars = configurations.runtimeClasspath.files
        if (jars*.name.sort() != ["Tuplite-${providers.gradleProperty('libraryVersion').getOrElse('1.0.1')}.jar".toString(), 'functional-interface-extension-1.1.3.jar'].sort()) {
            throw new GradleException("Unexpected runtime dependencies: ${jars*.name}")
        }
    }
}
